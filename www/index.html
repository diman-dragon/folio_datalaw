<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folio</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/library.css">
<link rel="stylesheet" href="css/viewer.css">
<link rel="stylesheet" href="css/thumbs.css">
<link rel="stylesheet" href="css/tools-panel.css">
<link rel="stylesheet" href="css/ocr.css">
<link rel="stylesheet" href="css/text-select.css">
<link rel="stylesheet" href="css/annot.css">
<link rel="stylesheet" href="css/dialog.css">
<link rel="stylesheet" href="css/drop.css">
<link rel="stylesheet" href="css/toast.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<div id="app">
  <section id="home">
    <header class="bar" role="banner">
      <div class="brand">
        <img class="logo" src="img/logo.png" alt="" width="32" height="32">
        <h1>Folio</h1>
      </div>
      <div class="bar-actions">
        <button class="icon-btn" id="theme-btn" title="Светлая / тёмная тема" aria-label="Переключить тему"><svg><use href="img/icons.svg#moon"/></svg></button>
        <span class="vsep"></span>
        <button class="btn btn-ghost" id="folder-btn" title="Добавить все документы из папки (Ctrl+Shift+O)"><svg width="18" height="18"><use href="img/icons.svg#folder"/></svg><span>Папка</span></button>
        <button class="btn" id="open-btn" title="Открыть PDF или FB2 (Ctrl+O)"><svg width="18" height="18"><use href="img/icons.svg#plus"/></svg><span>Открыть</span></button>
      </div>
    </header>
    <div class="body" id="home-body">
      <section id="sec-reading" class="sec sec-reading" hidden>
        <h2>Читаю сейчас <span class="cnt" id="cnt-reading"></span></h2>
        <ul id="reading-list" class="grid"></ul>
      </section>
      <section id="sec-rest" class="sec" hidden>
        <h2>Остальные <span class="cnt" id="cnt-rest"></span></h2>
        <ul id="doc-list" class="grid"></ul>
      </section>
      <p id="doc-hidden" class="small muted hidden-note" hidden><span id="hidden-text"></span> <button class="link-btn" id="hidden-clean">Убрать из библиотеки</button></p>
      <div id="doc-empty" class="empty" hidden>
        <img src="img/logo.png" alt="" width="96" height="96">
        <p>Библиотека пуста</p>
        <p class="small">Перетащите PDF или папку в окно, либо выберите их кнопками</p>
        <div class="empty-btns">
          <button class="btn" id="empty-open">Открыть PDF</button>
          <button class="btn btn-ghost" id="empty-folder">Открыть папку</button>
        </div>
      </div>
    </div>
  </section>
  <section id="viewer" hidden data-mode="ribbon">
    <header class="bar tb" role="toolbar" aria-label="Панель просмотра">
      <div class="tb-left">
        <button class="icon-btn" id="viewer-back" title="В библиотеку (Esc)" aria-label="В библиотеку"><svg><use href="img/icons.svg#back"/></svg></button>
        <button class="icon-btn" id="thumbs-btn" title="Миниатюры страниц" aria-label="Миниатюры страниц" aria-pressed="false"><svg><use href="img/icons.svg#thumbnails"/></svg></button>
        <span class="vsep"></span>
        <h1 id="viewer-title"></h1>
      </div>
      <div class="tb-center">
        <div class="tb-group" role="group" aria-label="Страницы">
          <button class="icon-btn" id="page-prev" title="Предыдущая страница" aria-label="Предыдущая страница"><svg><use href="img/icons.svg#prev"/></svg></button>
          <input id="page-input" type="number" min="1" value="1" aria-label="Номер страницы">
          <span id="page-total"></span>
          <button class="icon-btn" id="page-next" title="Следующая страница" aria-label="Следующая страница"><svg><use href="img/icons.svg#next"/></svg></button>
        </div>
        <div class="tb-group" role="group" aria-label="Масштаб">
          <button class="icon-btn" id="zoom-out" title="Уменьшить (Ctrl+−)" aria-label="Уменьшить"><svg><use href="img/icons.svg#zoom-out"/></svg></button>
          <button class="zoom-pct" id="zoom-label" title="Сбросить на 100% (Ctrl+0)">100%</button>
          <button class="icon-btn" id="zoom-in" title="Увеличить (Ctrl++)" aria-label="Увеличить"><svg><use href="img/icons.svg#zoom-in"/></svg></button>
          <button class="tb-text" id="zoom-fit" title="Подогнать по ширине окна">По ширине</button>
        </div>
        <div class="tb-group" role="group" aria-label="Режим просмотра">
          <button class="icon-btn on" id="mode-ribbon" title="Лента: страницы одна за другой" aria-label="Лента" aria-pressed="true"><svg><use href="img/icons.svg#scroll"/></svg></button>
          <button class="icon-btn" id="mode-paged" title="По одной странице" aria-label="По одной странице" aria-pressed="false"><svg><use href="img/icons.svg#pages"/></svg></button>
        </div>
      </div>
      <div class="tb-right">
        <button class="tb-toggle" id="edit-btn" title="Правка: выделение, подчёркивание, рисование" aria-pressed="false"><svg><use href="img/icons.svg#edit"/></svg><span>Правка</span></button>
        <button class="icon-btn" id="undo-btn" title="Отменить (Ctrl+Z)" aria-label="Отменить" disabled><svg><use href="img/icons.svg#undo"/></svg></button>
        <button class="icon-btn" id="redo-btn" title="Повторить (Ctrl+Y)" aria-label="Повторить" disabled><svg><use href="img/icons.svg#redo"/></svg></button>
      </div>
      <div id="read-progress" role="progressbar" aria-label="Прочитано" aria-valuemin="0" aria-valuemax="100"><i id="read-fill"></i></div>
    </header>
    <div id="viewer-main">
      <div id="thumbs-hot"></div>
      <aside id="thumbs">
        <div id="thumbs-head"><span>Страницы</span><button class="icon-btn" id="pin-btn" title="Закрепить панель" aria-label="Закрепить панель" aria-pressed="false"><svg><use href="img/icons.svg#pin"/></svg></button></div>
        <div id="thumbs-list"></div>
      </aside>
      <div id="viewer-scroll" tabindex="0"><div id="viewer-pages"></div></div>
    </div>
    <div id="tools-panel" class="tools-panel" hidden>
      <div class="tp-head"><button class="tp-pin" id="tp-pin" title="Зафиксировать положение панели" aria-label="Зафиксировать положение панели"><svg><use href="img/icons.svg#pin"/></svg></button><div class="tp-grip"><i></i></div><button class="tp-close" id="tp-hide" title="Скрыть панель" aria-label="Скрыть панель"><svg><use href="img/icons.svg#close"/></svg></button></div>
      <div class="tp-grid">
        <button class="tp-btn" data-tool="pen" title="Перо" aria-label="Перо"><svg><use href="img/icons.svg#pen"/></svg></button>
        <button class="tp-btn" data-tool="eraser" title="Ластик" aria-label="Ластик"><svg><use href="img/icons.svg#eraser"/></svg></button>
        <button class="tp-btn" data-tool="highlighter" title="Маркер" aria-label="Маркер"><svg><use href="img/icons.svg#highlighter"/></svg></button>
        <button class="tp-btn" data-tool="text-select" title="Выделить текст цветом" aria-label="Выделить текст цветом"><svg><use href="img/icons.svg#text-select"/></svg></button>
        <button class="tp-btn" data-tool="underline" title="Подчеркнуть текст" aria-label="Подчеркнуть текст"><svg><use href="img/icons.svg#underline"/></svg></button>
        <button class="tp-btn" id="tp-ocr" title="Распознать текст (OCR) на сканах" aria-label="Распознать текст (OCR) на сканах"><svg><use href="img/icons.svg#ocr"/></svg></button>
      </div>
      <div class="tp-colors">
        <button class="color-dot active" data-color="#2563eb" style="--c:#2563eb" title="Синий" aria-label="Синий"></button>
        <button class="color-dot" data-color="#ef4444" style="--c:#ef4444" title="Красный" aria-label="Красный"></button>
        <button class="color-dot" data-color="#facc15" style="--c:#facc15" title="Жёлтый" aria-label="Жёлтый"></button>
        <button class="color-dot" data-color="#10b981" style="--c:#10b981" title="Зелёный" aria-label="Зелёный"></button>
        <button class="color-dot" data-color="#f97316" style="--c:#f97316" title="Оранжевый" aria-label="Оранжевый"></button>
        <button class="color-dot" data-color="#ec4899" style="--c:#ec4899" title="Розовый" aria-label="Розовый"></button>
        <button class="color-dot" data-color="#8b5cf6" style="--c:#8b5cf6" title="Фиолетовый" aria-label="Фиолетовый"></button>
        <button class="color-dot" data-color="#06b6d4" style="--c:#06b6d4" title="Голубой" aria-label="Голубой"></button>
        <button class="color-dot" data-color="#92400e" style="--c:#92400e" title="Коричневый" aria-label="Коричневый"></button>
        <button class="color-dot" data-color="#6b7280" style="--c:#6b7280" title="Серый" aria-label="Серый"></button>
        <button class="color-dot" data-color="#1e293b" style="--c:#1e293b" title="Тёмный" aria-label="Тёмный"></button>
        <button class="color-dot" data-color="#ffffff" style="--c:#ffffff" title="Белый" aria-label="Белый"></button>
        <label class="color-dot custom" title="Свой цвет"><input type="color" id="tp-custom" value="#2563eb" aria-label="Свой цвет"></label>
      </div>
    </div>
    <div id="ocr-sheet" class="ocr-sheet" hidden>
      <div class="ocr-title">Распознавание текста (OCR)</div>
      <div class="ocr-langs" id="ocr-langs"></div>
      <div class="ocr-actions">
        <button id="ocr-page">Эта страница</button>
        <button id="ocr-all">Весь документ</button>
        <button id="ocr-close" title="Закрыть" aria-label="Закрыть"><svg><use href="img/icons.svg#close"/></svg></button>
      </div>
      <div class="ocr-error" id="ocr-error" hidden></div>
      <div class="ocr-run" id="ocr-run" hidden><div class="ocr-bar"><i id="ocr-fill"></i></div><span id="ocr-status"></span><button id="ocr-cancel">Отмена</button></div>
    </div>
    <div id="text-menu" class="text-bubble-menu" hidden>
      <button data-act="copy"><svg><use href="img/icons.svg#copy"/></svg><span>Копировать</span></button>
      <button data-act="hl"><svg><use href="img/icons.svg#highlighter"/></svg><span>Выделить</span></button>
      <button data-act="ul"><svg><use href="img/icons.svg#underline"/></svg><span>Подчеркнуть</span></button>
    </div>
  </section>
  <dialog id="pw">
    <form method="dialog">
      <p id="pw-msg"></p>
      <input id="pw-input" type="password" autocomplete="off" aria-label="Пароль документа">
      <div class="dlg-btns">
        <button type="button" class="btn btn-ghost" id="pw-cancel">Отмена</button>
        <button type="submit" class="btn" value="ok">ОК</button>
      </div>
    </form>
  </dialog>
  <div id="drop" hidden><span>Отпустите PDF, чтобы добавить</span></div>
  <div id="toast"></div>
</div>
</body>
</html>
