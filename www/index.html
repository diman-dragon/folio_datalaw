<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folio</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/library.css">
<link rel="stylesheet" href="css/viewer.css">
<link rel="stylesheet" href="css/thumbs.css">
<link rel="stylesheet" href="css/tools-panel.css">
<link rel="stylesheet" href="css/text-select.css">
<link rel="stylesheet" href="css/annot.css">
<link rel="stylesheet" href="css/dialog.css">
<link rel="stylesheet" href="css/drop.css">
<link rel="stylesheet" href="css/toast.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<div id="app">
  <section id="home">
    <header class="bar">
      <h1>Folio</h1>
      <button class="icon-btn" id="theme-btn" title="Тема: светлая / тёмная"><svg><use href="img/icons.svg#moon"/></svg></button>
      <button class="btn" id="open-btn" title="Открыть PDF (Ctrl+O)"><svg width="18" height="18"><use href="img/icons.svg#plus"/></svg><span>Открыть PDF</span></button>
    </header>
    <div class="body" id="home-body">
      <ul id="doc-list" class="grid"></ul>
      <div id="doc-empty" class="empty" hidden>
        <img src="img/emoji/books.png" alt="" width="72" height="72">
        <p>Библиотека пуста</p>
        <p class="small">Перетащите PDF в окно или нажмите «Открыть PDF» (Ctrl+O)</p>
        <button class="btn" id="empty-open">Открыть PDF</button>
      </div>
    </div>
  </section>
  <section id="viewer" hidden data-mode="ribbon">
    <header class="bar">
      <button class="icon-btn" id="viewer-back" title="В библиотеку (Esc)"><svg><use href="img/icons.svg#back"/></svg></button>
      <button class="icon-btn" id="thumbs-btn" title="Миниатюры: закрепить / открепить"><svg><use href="img/icons.svg#thumbnails"/></svg></button>
      <h1 id="viewer-title"></h1>
      <button class="icon-btn" id="page-prev" title="Предыдущая страница"><svg><use href="img/icons.svg#prev"/></svg></button>
      <input id="page-input" type="number" min="1" value="1" aria-label="Страница">
      <span id="page-total"></span>
      <button class="icon-btn" id="page-next" title="Следующая страница"><svg><use href="img/icons.svg#next"/></svg></button>
      <span class="gap"></span>
      <button class="icon-btn" id="mode-btn" title="Показывать по одной странице"><svg><use href="img/icons.svg#pages"/></svg></button>
      <span class="gap"></span>
      <button class="icon-btn" id="edit-btn" title="Редактирование: выделение, подчёркивание, рисование"><svg><use href="img/icons.svg#edit"/></svg></button>
      <button class="icon-btn" id="undo-btn" title="Отменить (Ctrl+Z)" disabled><svg><use href="img/icons.svg#undo"/></svg></button>
      <button class="icon-btn" id="redo-btn" title="Повторить (Ctrl+Y)" disabled><svg><use href="img/icons.svg#redo"/></svg></button>
      <span class="gap"></span>
      <button class="icon-btn" id="zoom-out" title="Уменьшить (Ctrl+−)"><svg><use href="img/icons.svg#zoom-out"/></svg></button>
      <span id="zoom-label">100%</span>
      <button class="icon-btn" id="zoom-in" title="Увеличить (Ctrl++)"><svg><use href="img/icons.svg#zoom-in"/></svg></button>
      <button class="txt-btn" id="zoom-fit" title="Подогнать под окно">По ширине</button>
    </header>
    <div id="viewer-main">
      <div id="thumbs-hot"></div>
      <aside id="thumbs">
        <div id="thumbs-head"><span>Страницы</span><button class="icon-btn" id="pin-btn" title="Закрепить панель"><svg><use href="img/icons.svg#pin"/></svg></button></div>
        <div id="thumbs-list"></div>
      </aside>
      <div id="viewer-scroll" tabindex="0"><div id="viewer-pages"></div></div>
    </div>
    <div id="tools-panel" class="tools-panel" hidden>
      <div class="tp-head"><div class="tp-grip"><i></i></div><button class="tp-close" id="tp-hide" title="Скрыть панель"><svg><use href="img/icons.svg#close"/></svg></button></div>
      <div class="tp-grid">
        <button class="tp-btn" data-tool="pen" title="Перо"><svg><use href="img/icons.svg#pen"/></svg></button>
        <button class="tp-btn" data-tool="eraser" title="Ластик"><svg><use href="img/icons.svg#eraser"/></svg></button>
        <button class="tp-btn" data-tool="highlighter" title="Маркер"><svg><use href="img/icons.svg#highlighter"/></svg></button>
        <button class="tp-btn" data-tool="text-select" title="Выделить текст цветом"><svg><use href="img/icons.svg#text-select"/></svg></button>
        <button class="tp-btn" data-tool="underline" title="Подчеркнуть текст"><svg><use href="img/icons.svg#underline"/></svg></button>
        <button class="tp-btn" id="tp-pin" title="Зафиксировать положение панели"><svg><use href="img/icons.svg#pin"/></svg></button>
      </div>
      <div class="tp-colors">
        <button class="color-dot active" data-color="#2563eb" style="--c:#2563eb" title="Синий"></button>
        <button class="color-dot" data-color="#ef4444" style="--c:#ef4444" title="Красный"></button>
        <button class="color-dot" data-color="#facc15" style="--c:#facc15" title="Жёлтый"></button>
        <button class="color-dot" data-color="#10b981" style="--c:#10b981" title="Зелёный"></button>
        <button class="color-dot" data-color="#f97316" style="--c:#f97316" title="Оранжевый"></button>
        <button class="color-dot" data-color="#ec4899" style="--c:#ec4899" title="Розовый"></button>
        <button class="color-dot" data-color="#8b5cf6" style="--c:#8b5cf6" title="Фиолетовый"></button>
        <button class="color-dot" data-color="#06b6d4" style="--c:#06b6d4" title="Голубой"></button>
        <button class="color-dot" data-color="#92400e" style="--c:#92400e" title="Коричневый"></button>
        <button class="color-dot" data-color="#6b7280" style="--c:#6b7280" title="Серый"></button>
        <button class="color-dot" data-color="#1e293b" style="--c:#1e293b" title="Тёмный"></button>
        <button class="color-dot" data-color="#ffffff" style="--c:#ffffff" title="Белый"></button>
        <label class="color-dot custom" title="Свой цвет"><input type="color" id="tp-custom" value="#2563eb"></label>
      </div>
    </div>
    <div id="text-menu" class="text-bubble-menu" hidden>
      <button data-act="copy"><svg><use href="img/icons.svg#copy"/></svg><span>Копировать</span></button>
      <button data-act="hl"><svg><use href="img/icons.svg#highlighter"/></svg><span>Выделить</span></button>
      <button data-act="ul"><svg><use href="img/icons.svg#underline"/></svg><span>Подчеркнуть</span></button>
    </div>
  </section>
  <dialog id="pw">
    <form method="dialog">
      <p id="pw-msg"></p>
      <input id="pw-input" type="password" autocomplete="off">
      <div class="dlg-btns">
        <button type="button" class="btn btn-ghost" id="pw-cancel">Отмена</button>
        <button type="submit" class="btn" value="ok">ОК</button>
      </div>
    </form>
  </dialog>
  <div id="drop" hidden><span>Отпустите PDF, чтобы добавить</span></div>
  <div id="toast"></div>
</div>
</body>
</html>
