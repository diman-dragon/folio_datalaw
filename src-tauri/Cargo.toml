[package]
name = "folio_datalaw"
version = "0.0.1"
description = "Folio Desktop - PDF viewer"
edition = "2021"
rust-version = "1.77"

[lib]
name = "folio_datalaw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
